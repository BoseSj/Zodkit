name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Show Swift Version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v
